# aiyuspot adapter registry - single source of truth.
# Parsed by wifi-control.bat (for /f), check-adapters.ps1, scripts/find-wifi.ps1,
# kali-wsl-hotspot.sh, and kali/adapter-provision.sh / driver/install-rt73.sh.
#
# Format: 13 pipe-delimited fields, '#' comments, '-' = empty (REQUIRED -
# cmd `for /f` collapses empty columns). Comma lists inside fields.
#
#  1 ids         all VID:PIDs we detect (incl. storage personalities)
#  2 wifi_ids    IDs that are Wi-Fi mode (attach/modprobe target);
#                ids - wifi_ids = storage-only personalities
#  3 name        display name
#  4 module      kernel module to modprobe ('-' = detect-only)
#  5 pre_modules modules loaded BEFORE `module` (space list; '-' none)
#  6 fw_stage    /lib/firmware paths staged into the WSL init namespace:
#                'p'      -> cd /lib/firmware && tar cf - p   (path preserved)
#                'dir/.'  -> cd /lib/firmware/dir && tar cf - . (contents flattened)
#  7 fw_pkg      Kali apt package that ships the firmware ('-' none)
#  8 kconfig     kernel symbols the custom kernel needs (SYM=m|y); aggregated
#                by install-rt73.sh into --module/--enable + .config guards
#  9 modeswitch  usb_modeswitch flag(s) for storage personality (K -> -K)
# 10 min_kernel  minimum kernel for AP mode ('-' = any)
# 11 install     repo-relative out-of-tree installer ('-' = in-tree module)
# 12 status      verified | pending | noap   (noap = detect/report only, no AP)
# 13 note        caveat shown by `check` and reused in docs
#
# File order doubles as the interface preference order in pick_wifi_if
# (out-of-tree FullMAC modules first, then in-tree by preference).
# ids|wifi_ids|name|module|pre_modules|fw_stage|fw_pkg|kconfig|modeswitch|min_kernel|install|status|note
